[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aws-cost-guard"
version = "0.1.0"
description = "Read-only AWS cost audit and reporting CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Layu Group LLC" }]
dependencies = [
  "boto3>=1.34",
  "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
aws-cost-guard = "aws_cost_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_cost_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
